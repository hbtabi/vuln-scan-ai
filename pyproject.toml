[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vuln-scan-ai"
version = "0.1.0"
description = "Defensive project auditor: hard-coded secrets, vulnerable dependencies, risky Dockerfile/CI/config patterns, with optional LLM remediation advice."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mohammed Hassan bin Tayyeb", email = "hasaantayyb1@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["packaging>=23", "PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
vuln-scan-ai = "vulnscan.cli:main"

[tool.setuptools.packages.find]
include = ["vulnscan*"]

[tool.setuptools.package-data]
vulnscan = ["data/*.json"]

[tool.ruff]
line-length = 150
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # long regexes read better on one line

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
